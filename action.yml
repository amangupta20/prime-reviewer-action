name: Prime reviewer
description: >-
  Runs Prime Agent on the owner's pull requests: pushes mechanical fixes,
  posts one-click suggestions, raises design issues, and answers /prime
  comments. Per-repository settings and the agent's prompts live in a
  private config repo.

inputs:
  app-id:
    description: The reviewer GitHub App's ID.
    required: true
  app-private-key:
    description: The reviewer GitHub App's private key.
    required: true
  opencode-api-key:
    description: Model provider key (OpenCode Go).
    required: true
  config-repo:
    description: Private config repo, owner/name. Default <owner>/prime-reviewer.
    required: false
    default: ""
  config-ref:
    description: Branch of the config repo to use, for trying a prompt change on one repo.
    required: false
    default: main
  prime-version:
    description: Prime Agent version, pinned.
    required: false
    default: "0.10.2"
  model:
    description: Overrides the model in the repo's config.toml.
    required: false
    default: ""
  approve-clean:
    description: >-
      "true" lets the App approve a commit whose review verdict is approve, and
      withdraw that approval when a later review of the pull request is not.
    required: false
    default: "false"

  state-backend:
    description: auto retains Git compatibility when B2 inputs are absent; b2 requires B2 configuration.
    required: false
    default: auto
  b2-endpoint-url:
    description: Private B2 S3 endpoint; configure all B2 inputs to enable object storage.
    required: false
    default: ""
  b2-bucket:
    description: Dedicated private reviewer bucket name.
    required: false
    default: ""
  b2-region:
    description: B2 S3 region.
    required: false
    default: ""
  b2-access-key-id:
    description: Application key ID scoped to the reviewer bucket.
    required: false
    default: ""
  b2-secret-access-key:
    description: Application key scoped to the reviewer bucket.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Keep this step first. The job holds a model key and a token that can
    # push, and the agent runs commands in the pull request's checkout, so
    # nothing may happen for a pull request or comment that is not the
    # owner's. On the gate event it fails, so the required check is red, not
    # skipped (a skipped required check counts as passing).
    - name: Only the owner's pull requests and comments
      shell: bash
      env:
        PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        COMMENTER: ${{ github.event.comment.user.login }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.repository }}
      run: |
        if [ "$PR_AUTHOR" != "$OWNER" ] \
          || { [ -n "$COMMENTER" ] && [ "$COMMENTER" != "$OWNER" ]; } \
          || { [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO" ]; }; then
          echo "Not reviewed: the Prime reviewer only runs on the owner's own pull requests and comments. The owner reviews this one by hand."
          exit 1
        fi

    - name: Validate requested state backend
      shell: bash
      env:
        BACKEND: ${{ inputs.state-backend }}
        B2_ENDPOINT_URL: ${{ inputs.b2-endpoint-url }}
        B2_BUCKET: ${{ inputs.b2-bucket }}
        B2_REGION: ${{ inputs.b2-region }}
        B2_ACCESS_KEY_ID: ${{ inputs.b2-access-key-id }}
        B2_SECRET_ACCESS_KEY: ${{ inputs.b2-secret-access-key }}
      run: |
        case "$BACKEND" in
          auto|b2) ;;
          *) echo "Unknown state backend"; exit 1 ;;
        esac
        if [ "$BACKEND" = b2 ]; then
          for name in B2_ENDPOINT_URL B2_BUCKET B2_REGION B2_ACCESS_KEY_ID B2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "B2 state storage requested but a required input is missing."
              exit 1
            fi
          done
        fi

    - name: Config repo name
      id: cfg
      shell: bash
      env:
        CONFIG_REPO: ${{ inputs.config-repo }}
        OWNER: ${{ github.repository_owner }}
      run: |
        repo="${CONFIG_REPO:-$OWNER/prime-reviewer}"
        if [ "${repo%/*}" != "$OWNER" ]; then
          echo "Config repo must belong to the caller repository owner."
          exit 1
        fi
        echo "full=$repo" >> "$GITHUB_OUTPUT"
        echo "name=${repo#*/}" >> "$GITHUB_OUTPUT"

    - name: App token
      id: app
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ github.event.repository.name }},${{ steps.cfg.outputs.name }}

    - name: Rules from the default branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: rules
        persist-credentials: false

    - name: Reviewer config (private)
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.cfg.outputs.full }}
        ref: ${{ inputs.config-ref }}
        token: ${{ steps.app.outputs.token }}
        path: agent
        persist-credentials: false

    # Prime runs as its own user, so it cannot read this job's credentials
    # (they live in the runner user's processes) or change any file the
    # reviewer later trusts. It is installed fresh on every run: a cache
    # saved after a run would hold files Prime could have changed.
    - name: Install Prime Agent for its own user
      shell: bash
      env:
        PRIME_AGENT_VERSION: ${{ inputs.prime-version }}
      run: |
        id prime-runner >/dev/null 2>&1 || sudo useradd --create-home --shell /bin/bash prime-runner
        curl -fsSL https://app.primeintellect.ai/prime-agent/install.sh -o "$RUNNER_TEMP/install.sh"
        sudo install -m 644 "$RUNNER_TEMP/install.sh" /home/prime-runner/install.sh
        # From Prime's home: the job's folder is not readable by that user, and
        # the installer's uv step reads uv.toml from the current folder.
        sudo -n -u prime-runner -H /usr/bin/env --chdir=/home/prime-runner DO_NOT_TRACK=1 \
          PRIME_AGENT_VERSION="$PRIME_AGENT_VERSION" sh /home/prime-runner/install.sh
        sudo -n -u prime-runner -H /usr/bin/env --chdir=/home/prime-runner \
          /home/prime-runner/.local/bin/prime-agent --version

    - name: Install object storage client
      if: inputs.b2-bucket != ''
      shell: bash
      # --target: the wrapper runs with python3 -I, which ignores a per-user
      # install, and the runner's system Python may refuse a global one.
      run: >-
        python3 -m pip install --disable-pip-version-check --quiet
        --target "$RUNNER_TEMP/prime-pylib" 'boto3==1.42.4'

    # Event text (comments, the PR body) reaches the script through the
    # environment, never pasted into a shell line.
    - name: Run the reviewer
      shell: bash
      env:
        B2_ENDPOINT_URL: ${{ inputs.b2-endpoint-url }}
        B2_BUCKET: ${{ inputs.b2-bucket }}
        B2_REGION: ${{ inputs.b2-region }}
        B2_ACCESS_KEY_ID: ${{ inputs.b2-access-key-id }}
        B2_SECRET_ACCESS_KEY: ${{ inputs.b2-secret-access-key }}
        GH_TOKEN: ${{ steps.app.outputs.token }}
        STATE_BACKEND: ${{ inputs.state-backend }}
        APP_SLUG: ${{ steps.app.outputs.app-slug }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        CONFIG_REPO: ${{ steps.cfg.outputs.full }}
        CONFIG_REF: ${{ inputs.config-ref }}
        PRIME_AGENT_VERSION: ${{ inputs.prime-version }}
        PRIME_MODEL: ${{ inputs.model }}
        APPROVE_CLEAN: ${{ inputs.approve-clean }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        REPO: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        SENDER: ${{ github.event.sender.login }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_PATH: ${{ github.event.comment.path }}
        COMMENT_LINE: ${{ github.event.comment.line }}
        COMMENT_REPLY_TO: ${{ github.event.comment.in_reply_to_id }}
        PR_BODY: ${{ github.event.pull_request.body }}
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PRIME_PYLIB: ${{ runner.temp }}/prime-pylib
      run: python3 -I "$GITHUB_ACTION_PATH/prime-review.py"
